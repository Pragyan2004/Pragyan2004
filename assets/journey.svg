<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
<title id="t">My journey: Data, Models, Research, Agents, Production</title>
<desc id="d">Animated timeline of Pragyan Kumar's career from data analysis in 2024 to AI engineering in production in 2026.</desc>
