<text x="450" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#F8FAFC" opacity="0">Started with data: SQL, analysis and BI as a data analyst intern<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0300;0.1575;0.1875;1.0000" dur="20.0s" repeatCount="indefinite"/></text>
