<circle cx="620" cy="140" r="22" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0"><animate attributeName="r" values="22;22;44;44" keyTimes="0.0000;0.5625;0.6225;1.0000" dur="20.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0.0000;0.5625;0.5675;0.6225;1.0000" dur="20.0s" repeatCount="indefinite"/></circle>
<text x="620" y="146" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">4</text>
<text x="620" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">2026</text>
<text x="620" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">Agents</text>
<text x="450" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#F8FAFC" opacity="0">Moved to multi-agent systems with LangGraph, CrewAI and MCP<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5625;0.5925;0.7200;0.7500;1.0000" dur="20.0s" repeatCount="indefinite"/></text>
