<text x="450" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">Research</text>
<text x="450" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#F8FAFC" opacity="0">Published a crop-selection paper in IET, reporting 99.5% accuracy<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3750;0.4050;0.5325;0.5625;1.0000" dur="20.0s" repeatCount="indefinite"/></text>
