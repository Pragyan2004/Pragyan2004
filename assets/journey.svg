<text x="450" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#F8FAFC" opacity="0">Working as an AI Engineer: shipping end-to-end AI pipelines<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7800;0.9400;0.9700;1.0000" dur="20.0s" repeatCount="indefinite"/></text>
